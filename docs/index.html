<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille Finance / Économie — en direct</title>
<style>
  :root {
    --fond: #f4f5f7;
    --carte: #ffffff;
    --texte: #1a1a1a;
    --texte-doux: #666;
    --bord: #e2e4e8;
    --accent: #2b6cb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #16181d;
      --carte: #1e2127;
      --texte: #e8e8e8;
      --texte-doux: #9aa0a6;
      --bord: #2c2f36;
      --accent: #63b3ed;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fond);
    color: var(--texte);
  }
  header {
    position: sticky;
    top: 0;
    background: var(--carte);
    border-bottom: 1px solid var(--bord);
    padding: 14px 20px;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 17px; }
  header .meta { margin-top: 4px; font-size: 13px; color: var(--texte-doux); }
  main { max-width: 820px; margin: 0 auto; padding: 16px 14px 60px; }
  .article {
    background: var(--carte);
    border: 1px solid var(--bord);
    border-left: 4px solid var(--barre, var(--bord));
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .article a.titre {
    color: var(--texte);
    text-decoration: none;
    font-weight: 600;
    font-size: 15.5px;
  }
  .article a.titre:hover { color: var(--accent); text-decoration: underline; }
  .ligne-meta {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--texte-doux);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .puce {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .resume { margin-top: 8px; font-size: 13.5px; color: var(--texte-doux); }
  .vide { text-align: center; color: var(--texte-doux); padding: 40px 0; }
  footer { text-align: center; font-size: 12px; color: var(--texte-doux); padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>Veille Finance / Économie — en direct</h1>
  <div class="meta" id="meta">Chargement…</div>
</header>
<main id="liste"></main>
<footer>
  Mise à jour automatique toutes les 5 min côté serveur · la page se rafraîchit toute seule ·
  les articles disparaissent après <span id="fenetre">24</span> h.
</footer>

<script>
const RAFRAICHISSEMENT_MS = 120000; // la page recharge le JSON toutes les 2 min

function ilYA(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return "à l'instant";
  if (min < 60) return "il y a " + min + " min";
  const h = Math.floor(min / 60);
  if (h < 24) return "il y a " + h + " h";
  return "il y a " + Math.floor(h / 24) + " j";
}

function contraste(hex) {
  const n = parseInt(hex, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? "#1a1a1a" : "#ffffff";
}

function rendre(data) {
  const fenetre = data.fenetre_heures || 24;
  document.getElementById("fenetre").textContent = fenetre;
  const limite = Date.now() - fenetre * 3600000;

  // filtre 24 h aussi côté client, au cas où le JSON serait un peu en retard
  const articles = (data.articles || []).filter(a => {
    const t = new Date(a.vu_le).getTime();
    return isNaN(t) || t >= limite;
  });

  const gen = new Date(data.genere_le);
  document.getElementById("meta").textContent =
    articles.length + " article" + (articles.length > 1 ? "s" : "") +
    " · collecte serveur " + (isNaN(gen) ? "?" : ilYA(data.genere_le));

  const liste = document.getElementById("liste");
  if (!articles.length) {
    liste.innerHTML = '<div class="vide">Aucun article dans la fenêtre. La prochaine collecte arrive dans quelques minutes.</div>';
    return;
  }

  liste.innerHTML = articles.map(a => {
    const c = (a.couleur || "D9D9D9").replace("#", "");
    const quand = a.date_publication ? ilYA(a.date_publication) : ilYA(a.vu_le);
    return `<article class="article" style="--barre:#${c}">
      <a class="titre" href="${a.url}" target="_blank" rel="noopener">${escap(a.titre)}</a>
      <div class="ligne-meta">
        <span class="puce" style="background:#${c};color:${contraste(c)}">${escap(a.theme)}</span>
        <span>${escap(a.source)}</span>
        <span>·</span>
        <span>${quand}</span>
      </div>
      ${a.resume ? `<div class="resume">${escap(a.resume)}</div>` : ""}
    </article>`;
  }).join("");
}

function escap(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function charger() {
  fetch("articles.json?_=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(rendre)
    .catch(() => {
      document.getElementById("meta").textContent =
        "Impossible de charger les données pour l'instant — nouvelle tentative bientôt.";
    });
}

charger();
setInterval(charger, RAFRAICHISSEMENT_MS);
</script>
</body>
</html>
